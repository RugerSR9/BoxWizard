<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>BoxWizard - Terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
<style>
  html, body { height: 100%; margin: 0; background: #111318; }
  #term { height: 100vh; padding: 4px; box-sizing: border-box; }
  #banner {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #f2b8b5; background: #3a1f1f; padding: 6px 10px; font-size: 0.85rem;
    display: none;
  }
</style>
</head>
<body>
<div id="banner"></div>
<div id="term"></div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script>
  const id = new URLSearchParams(location.search).get("id");
  const banner = document.getElementById("banner");
  function showBanner(msg) {
    banner.textContent = msg;
    banner.style.display = "block";
  }

  const term = new Terminal({ convertEol: true, cursorBlink: true, theme: { background: "#111318" } });
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById("term"));
  fitAddon.fit();
  window.addEventListener("resize", () => fitAddon.fit());

  if (!id) {
    showBanner("Missing ?id=<environmentId> in the URL.");
  } else {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/environments/${id}/terminal`);
    ws.binaryType = "arraybuffer";
    ws.onopen = () => term.writeln(`Connected to environment ${id}.\r\n`);
    ws.onmessage = (evt) => term.write(new Uint8Array(evt.data));
    ws.onclose = (evt) => showBanner(evt.reason ? `Connection closed: ${evt.reason}` : "Connection closed.");
    ws.onerror = () => showBanner("WebSocket connection error.");
    term.onData((data) => {
      if (ws.readyState === WebSocket.OPEN) ws.send(data);
    });
  }
</script>
</body>
</html>
